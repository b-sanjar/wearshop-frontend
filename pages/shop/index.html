<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WearShop Premium | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/layout.css" />
    <link rel="stylesheet" href="../../assets/css/pages/shop.css" />
  </head>
  <body>
    <div class="bg-aurora a1"></div>
    <div class="bg-aurora a2"></div>
    <header id="siteHeader" class="header"></header>

    <main class="section">
      <div class="container">
        <section class="shop-hero">
          <div class="shop-hero-top">
            <div>
              <p class="pill">Premium Commerce</p>
              <h1 class="page-title">Shop Catalog</h1>
              <p class="muted">
                Kategoriyalar, smart filtering, premium cards va zamonaviy shopping flow.
              </p>
            </div>
            <button id="viewModeBtn" class="chip">
              <i class="fa-solid fa-list"></i> List mode
            </button>
          </div>
          <div class="shop-stats">
            <article class="shop-stat"><strong id="shopStatAll">0</strong><span class="muted">Jami mahsulot</span></article>
            <article class="shop-stat"><strong id="shopStatCategories">0</strong><span class="muted">Kategoriya</span></article>
            <article class="shop-stat"><strong id="shopStatDiscount">0</strong><span class="muted">Chegirmadagi</span></article>
            <article class="shop-stat"><strong id="shopStatNew">0</strong><span class="muted">Yangi kelgan</span></article>
          </div>
        </section>

        <div class="shop-layout">
          <aside class="shop-side">
            <h3 class="side-title"><i class="fa-solid fa-sliders"></i> Filter panel</h3>
            <div class="filter-group">
              <label class="muted">Kategoriya</label>
              <select id="categorySelect"></select>
            </div>
            <div class="filter-group">
              <label class="muted">Saralash</label>
              <select id="sortSelect">
                <option value="featured">Tavsiya</option>
                <option value="price_asc">Narx: arzon</option>
                <option value="price_desc">Narx: qimmat</option>
                <option value="rating_desc">Reyting</option>
                <option value="newest">Yangi</option>
                <option value="popular">Ommabop</option>
              </select>
            </div>
            <div class="filter-group">
              <label class="muted">Narx oralig'i</label>
              <input id="minPriceInput" type="number" min="0" placeholder="Min narx" />
              <input id="maxPriceInput" type="number" min="0" placeholder="Maks narx" />
            </div>
            <div class="quick-filters">
              <button class="chip quick-filter" data-quick="best">
                <i class="fa-solid fa-fire"></i> Best
              </button>
              <button class="chip quick-filter" data-quick="new">
                <i class="fa-solid fa-sparkles"></i> New
              </button>
              <button class="chip quick-filter" data-quick="discount">
                <i class="fa-solid fa-tags"></i> Discount
              </button>
              <button class="chip quick-filter" data-quick="rating">
                <i class="fa-solid fa-star"></i> Top
              </button>
            </div>
            <div style="margin-top: 0.7rem">
              <button id="applyFilterBtn" class="btn btn-primary" style="width: 100%">
                <i class="fa-solid fa-filter-circle-dollar"></i> Qo'llash
              </button>
            </div>
          </aside>

          <section class="shop-main">
            <div class="toolbar">
              <div class="field-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="text" placeholder="Mahsulot nomi bo'yicha qidiring..." />
              </div>
              <select id="quickPreset">
                <option value="none">Quick: Hammasi</option>
                <option value="new">Quick: New arrivals</option>
                <option value="best">Quick: Best seller</option>
                <option value="discount">Quick: Discount only</option>
                <option value="premium">Quick: Premium only</option>
              </select>
              <select id="viewPreset">
                <option value="modern">View: Modern cards</option>
                <option value="compact">View: Compact cards</option>
              </select>
            </div>

            <div id="statusBar" class="muted" style="margin-top: 0.75rem"></div>
            <section id="productsGrid" class="products-grid"></section>
            <div class="pagination">
              <button id="prevBtn" class="btn btn-soft"><i class="fa-solid fa-arrow-left"></i> Oldingi</button>
              <span id="pageInfo">1 / 1</span>
              <button id="nextBtn" class="btn btn-soft">Keyingi <i class="fa-solid fa-arrow-right"></i></button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
    <div id="toast" class="toast"></div>

    <script src="../../assets/js/common/config.js"></script>
    <script src="../../assets/js/common/state.js"></script>
    <script src="../../assets/js/common/api.js"></script>
    <script src="../../assets/js/common/ui.js"></script>
    <script src="../../assets/js/pages/shop.js"></script>
  </body>
</html>
