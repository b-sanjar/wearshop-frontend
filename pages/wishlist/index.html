<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WearShop Premium | Wishlist Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/layout.css" />
    <link rel="stylesheet" href="../../assets/css/pages/wishlist.css" />
  </head>
  <body>
    <div class="bg-aurora a1"></div>
    <div class="bg-aurora a3"></div>
    <header id="siteHeader" class="header"></header>

    <main class="section">
      <div class="container">
        <section class="wishlist-hero">
          <h1>Wishlist Studio</h1>
          <p class="muted">Saqlangan mahsulotlar, trend tahlil va smart actionlar bir sahifada</p>
          <div class="wishlist-kpis">
            <article class="kpi"><strong id="kpiCount">0</strong><span class="muted">Items</span></article>
            <article class="kpi"><strong id="kpiValue">0</strong><span class="muted">Jami qiymat</span></article>
            <article class="kpi"><strong id="kpiDiscount">0%</strong><span class="muted">O'rtacha chegirma</span></article>
            <article class="kpi"><strong id="kpiTop">-</strong><span class="muted">Top kategoriya</span></article>
          </div>
        </section>

        <div class="wishlist-layout">
          <section id="wishlistGrid" class="wishlist-grid"></section>
          <aside class="wishlist-side">
            <h3><i class="fa-solid fa-chart-simple"></i> Trend Insights</h3>
            <p class="muted">Wishlist asosida tavsiyalar va keyingi xarid uchun signal</p>
            <div id="trendList" class="trend-list"></div>
            <div style="margin-top: 0.75rem; display: grid; gap: 0.45rem">
              <a href="../shop/index.html" class="btn btn-primary">
                <i class="fa-solid fa-bag-shopping"></i> Shopga o'tish
              </a>
              <a href="../checkout/index.html" class="btn btn-soft">
                <i class="fa-solid fa-credit-card"></i> Checkoutga o'tish
              </a>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
    <div id="toast" class="toast"></div>
    <script src="../../assets/js/common/config.js"></script>
    <script src="../../assets/js/common/state.js"></script>
    <script src="../../assets/js/common/api.js"></script>
    <script src="../../assets/js/common/ui.js"></script>
    <script src="../../assets/js/pages/wishlist.js"></script>
  </body>
</html>
