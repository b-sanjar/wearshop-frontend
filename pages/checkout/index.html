<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WearShop Premium | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/layout.css" />
    <link rel="stylesheet" href="../../assets/css/pages/checkout.css" />
  </head>
  <body>
    <div class="bg-aurora a2"></div>
    <header id="siteHeader" class="header"></header>

    <main class="section">
      <div class="container">
        <section class="checkout-hero">
          <h1>Smart Checkout</h1>
          <p class="muted">
            To'liq buyurtma boshqaruvi: promo, shipping, payment, summary va real-time hisob
          </p>
        </section>

        <div class="checkout-grid">
          <section class="panel">
            <h3><i class="fa-solid fa-address-card"></i> Yetkazib berish ma'lumotlari</h3>
            <div class="form-grid">
              <input id="fullName" type="text" placeholder="To'liq ism" />
              <input id="phone" type="text" placeholder="Telefon" />
              <input id="address" class="full" type="text" placeholder="Manzil" />
              <input id="promoCode" type="text" placeholder="Promo kod" />
              <select id="paymentMethod">
                <option value="card">Karta</option>
                <option value="cash">Naqd</option>
                <option value="transfer">Bank o'tkazmasi</option>
              </select>
              <textarea id="note" class="full" rows="4" placeholder="Izoh"></textarea>
            </div>
            <div style="margin-top: 0.72rem">
              <button id="orderBtn" class="btn btn-primary">
                <i class="fa-solid fa-check"></i> Buyurtmani tasdiqlash
              </button>
            </div>
          </section>

          <aside class="panel">
            <h3><i class="fa-solid fa-receipt"></i> Order Summary</h3>
            <div id="summaryList" class="summary-list"></div>
            <div class="total-box">
              <p>Subtotal: <strong id="subtotal">0 so'm</strong></p>
              <p>Total: <strong id="total">0 so'm</strong></p>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
    <div id="toast" class="toast"></div>
    <script src="../../assets/js/common/config.js"></script>
    <script src="../../assets/js/common/state.js"></script>
    <script src="../../assets/js/common/api.js"></script>
    <script src="../../assets/js/common/ui.js"></script>
    <script src="../../assets/js/pages/checkout.js"></script>
  </body>
</html>
