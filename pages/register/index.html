<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WearShop Premium | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/layout.css" />
    <link rel="stylesheet" href="../../assets/css/pages/auth.css" />
  </head>
  <body>
    <div class="bg-aurora a2"></div>
    <header id="siteHeader" class="header"></header>

    <main class="section">
      <div class="container auth-wrap">
        <section class="auth-card">
          <div class="auth-head">
            <h1><i class="fa-solid fa-user-plus"></i> Ro'yxatdan o'tish</h1>
            <p class="muted">Yangi hisob yarating va premium imkoniyatlarni oching</p>
          </div>
          <div class="auth-grid">
            <input id="name" type="text" placeholder="Ism" />
            <input id="email" type="email" placeholder="Email" />
            <input id="phone" type="text" placeholder="Telefon" />
            <input id="city" type="text" placeholder="Shahar" />
            <select id="gender">
              <option value="">Jinsni tanlang</option>
              <option value="Erkak">Erkak</option>
              <option value="Ayol">Ayol</option>
            </select>
            <input id="address" type="text" placeholder="Manzil (ixtiyoriy)" />
            <input id="password" type="password" placeholder="Parol (kamida 6 belgi)" />
          </div>
          <div class="auth-actions">
            <button id="registerBtn" class="btn btn-primary">
              <i class="fa-solid fa-circle-check"></i> Register
            </button>
            <a class="btn btn-soft" href="../login/index.html">
              <i class="fa-solid fa-right-to-bracket"></i> Login sahifasi
            </a>
          </div>
        </section>
      </div>
    </main>

    <footer id="siteFooter" class="footer"></footer>
    <div id="toast" class="toast"></div>
    <script src="../../assets/js/common/config.js"></script>
    <script src="../../assets/js/common/state.js"></script>
    <script src="../../assets/js/common/api.js"></script>
    <script src="../../assets/js/common/ui.js"></script>
    <script src="../../assets/js/pages/register.js"></script>
  </body>
</html>
